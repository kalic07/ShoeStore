version: "3.9"

# ---------------------------------------------------------------------------
# ShoeStore microservices stack
#
# Topology:
#   React SPA  --->  ApiGateway (YARP)  --->  Identity.Api  (auth/JWT)
#                                        --->  Catalog.Api   (products)
#                                        --->  Order.Api     (orders)
#                                        --->  Payment.Api   (payments)
#
#   Order.Api  --publishes OrderCreated-->      RabbitMQ  --consumed by--> Payment.Api
#   Payment.Api --publishes PaymentSucceeded/Failed--> RabbitMQ --consumed by--> Order.Api
#
# Each service owns its own database (database-per-service). For local/dev
# simplicity they run inside one Postgres container as separate databases;
# in a real production deployment each would get its own managed instance.
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    container_name: shoestore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: shoestore
      POSTGRES_PASSWORD: shoestore_dev_pw
    volumes:
      - ./deploy/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shoestore"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: shoestore-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: shoestore
      RABBITMQ_DEFAULT_PASS: shoestore_dev_pw
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI (http://localhost:15672)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  identity-api:
    build:
      context: .
      dockerfile: src/Services/Identity/Identity.Api/Dockerfile
    container_name: shoestore-identity-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__IdentityDb: "Host=postgres;Port=5432;Database=identity_db;Username=shoestore;Password=shoestore_dev_pw"
      Jwt__Issuer: "shoestore-identity"
      Jwt__Audience: "shoestore-clients"
      Jwt__SigningKey: "CHANGE_ME_dev_only_super_secret_signing_key_32bytes+"
      Jwt__AccessTokenMinutes: "30"
    ports:
      - "5101:8080"

  catalog-api:
    build:
      context: .
      dockerfile: src/Services/Catalog/Catalog.Api/Dockerfile
    container_name: shoestore-catalog-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__CatalogDb: "Host=postgres;Port=5432;Database=catalog_db;Username=shoestore;Password=shoestore_dev_pw"
      Jwt__Issuer: "shoestore-identity"
      Jwt__Audience: "shoestore-clients"
      Jwt__SigningKey: "CHANGE_ME_dev_only_super_secret_signing_key_32bytes+"
    ports:
      - "5102:8080"

  order-api:
    build:
      context: .
      dockerfile: src/Services/Order/Order.Api/Dockerfile
    container_name: shoestore-order-api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__OrderDb: "Host=postgres;Port=5432;Database=order_db;Username=shoestore;Password=shoestore_dev_pw"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "shoestore"
      RabbitMq__Password: "shoestore_dev_pw"
      Jwt__Issuer: "shoestore-identity"
      Jwt__Audience: "shoestore-clients"
      Jwt__SigningKey: "CHANGE_ME_dev_only_super_secret_signing_key_32bytes+"
      Services__CatalogApiBaseUrl: "http://catalog-api:8080"
    ports:
      - "5103:8080"

  payment-api:
    build:
      context: .
      dockerfile: src/Services/Payment/Payment.Api/Dockerfile
    container_name: shoestore-payment-api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PaymentDb: "Host=postgres;Port=5432;Database=payment_db;Username=shoestore;Password=shoestore_dev_pw"
      RabbitMq__Host: "rabbitmq"
      RabbitMq__Username: "shoestore"
      RabbitMq__Password: "shoestore_dev_pw"
      Jwt__Issuer: "shoestore-identity"
      Jwt__Audience: "shoestore-clients"
      Jwt__SigningKey: "CHANGE_ME_dev_only_super_secret_signing_key_32bytes+"
    ports:
      - "5104:8080"

  api-gateway:
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    container_name: shoestore-api-gateway
    depends_on:
      - identity-api
      - catalog-api
      - order-api
      - payment-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      # Override appsettings.json's localhost defaults (meant for running each
      # service with `dotnet run` outside Docker) with the container hostnames
      # from docker-compose's internal network.
      ReverseProxy__Clusters__identity-cluster__Destinations__destination1__Address: "http://identity-api:8080"
      ReverseProxy__Clusters__catalog-cluster__Destinations__destination1__Address: "http://catalog-api:8080"
      ReverseProxy__Clusters__order-cluster__Destinations__destination1__Address: "http://order-api:8080"
      ReverseProxy__Clusters__payment-cluster__Destinations__destination1__Address: "http://payment-api:8080"
      Cors__AllowedOrigins__0: "http://localhost:5173"
    ports:
      - "5100:8080"

  frontend:
    build:
      context: ../frontend
      args:
        # Browser-side code, so it must reach the gateway via a URL the host
        # machine (not the Docker network) can resolve - localhost:5100, which
        # is published above.
        VITE_API_BASE_URL: http://localhost:5100
    container_name: shoestore-frontend
    depends_on:
      - api-gateway
    ports:
      - "5173:80"

volumes:
  postgres-data:
