name: CI Shoe store

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Run unit tests
      run: dotnet test --no-build --configuration Release --verbosity normal

    # Optional: Publish and upload the artifact so the deployment job can use it
    - name: Publish application
      run: dotnet publish --no-build --configuration Release --output ./publish

    - name: Upload artifact for deployment
      uses: actions/upload-artifact@v4
      with:
        name: dotnet-app-package
        path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test # Ensures deployment ONLY runs if build and tests pass
    if: github.event_name == 'push' # Only deploy on actual merges/pushes to main, not PRs
    
    environment:
      name: 'Production' # Connects to a GitHub environment if you have one configured

    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: dotnet-app-package
        path: ./publish

    # --- SWAP THIS STEP OUT BASED ON YOUR HOSTING PROVIDER ---
    # Example for Azure Web Apps:
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'your-app-name-on-azure'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish        
